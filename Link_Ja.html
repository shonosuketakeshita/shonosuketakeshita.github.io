  <title>Links</title>
  <style>
    /* スクロールバーの幅を常に確保 (ページの長さによってメニューの位置がずれないように) */
    html {
      scrollbar-gutter: stable;
    }

    h1 {
      margin-top: 20px; /* 見出しの上部の余白 */
      margin-left: 20px; /* 見出しの左側の余白 */
    }

    h2, h4, h5 {
      text-align: left;
      border-bottom: 2px solid #000; /* 下線のスタイルを追加 */
      padding-bottom: 5px; /* 下線とテキストの間隔を調整 */
      margin-bottom: 20px; /* 下線と次の要素の間隔を調整 */
    }

    ul {
      list-style-type: square;
      padding-left: 0;
    }

    .navbar-text, .navbar-nav .nav-link {
      font-weight: 700;
    }

    footer {
      text-align: center;
    }

    /* スマホ表示の調整 */
    @media (max-width: 575px) {
      h1 { font-size: 1.6rem; margin-left: 15px; }
    }

    /* 上に戻るボタン (右下に表示、スクロールしたときだけ現れる) */
    .to-top {
      position: fixed;
      right: 20px;
      bottom: 20px;
      width: 44px;
      height: 44px;
      border: none;
      border-radius: 50%;
      background-color: rgba(52, 58, 64, 0.85); /* フッターと同じ濃いグレー */
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.3);
      cursor: pointer;
      z-index: 1030;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.3s, visibility 0.3s;
    }
    .to-top.show { opacity: 1; visibility: visible; }
    .to-top:hover { background-color: rgba(52, 58, 64, 1); }
    @media (max-width: 575px) {
      .to-top { right: 14px; bottom: 14px; }
    }

    /* リンク集 */
    .link-list {
      list-style-type: square;
      padding-left: 1.2em;
      margin-bottom: 1.5rem;
    }
    .link-list > li { margin-bottom: 0.6rem; }
    /* arXiv の分野ごとの new / recent を揃えて並べる */
    .arxiv-cats {
      display: grid;
      grid-template-columns: 5.5em auto;
      row-gap: 0.25rem;
      margin-top: 0.4rem;
    }
    .arxiv-cats .cat { font-weight: 700; }
    /* スマホでは更新日を小さく表示 (幅360px未満のとても小さい画面では非表示) */
    @media (max-width: 767px) {
      .nav-update { font-size: 0.75rem; }
    }
    @media (max-width: 359px) {
      .nav-update { display: none; }
    }
  </style>
</head>

<!-- 上に戻るボタン -->
<button type="button" id="toTop" class="to-top" aria-label="ページの先頭へ戻る" title="ページの先頭へ戻る">
  <svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12l6-6 6 6"/></svg>
</button>
<script>
  (function () {
    var btn = document.getElementById('toTop');
    function toggle() {
      if (window.pageYOffset > 300) { btn.classList.add('show'); }
      else { btn.classList.remove('show'); }
    }
    window.addEventListener('scroll', toggle);
    toggle();
    btn.addEventListener('click', function () {
      window.scrollTo({ top: 0, behavior: 'smooth' });
    });
  })();
</script>
